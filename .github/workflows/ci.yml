name: CI
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Lint
        run: npx eslint "src/**/*.ts"

      - name: Run unit tests
        run: npm run test

      - name: Run type tests
        run: npm run test:types
