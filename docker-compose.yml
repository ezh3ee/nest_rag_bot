services:
  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:latest
    container_name: rag_factory_qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage

  migrate:
    build:
      context: .
      target: runner
    container_name: rag_factory_migrate
    env_file: .env
    environment:
      DATABASE_URL: file:/data/prod.db
    volumes:
      - app_data:/data
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    container_name: rag_factory_app
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: file:/data/prod.db
    ports:
      - '3000:3000'
    volumes:
      - app_data:/data
    depends_on:
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  qdrant_data:
  app_data:
